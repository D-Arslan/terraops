# TerraOps MLOps stack:
#  - minio     S3-compatible object storage. TWO buckets, one per tool:
#              terraops-dvc (data versioning) / terraops-mlflow (run artifacts).
#              Separate lifecycles — a `dvc gc` must never be able to touch MLflow artifacts.
#  - postgres  MLflow BACKEND STORE: runs, params, metrics, tags, registry.
#              Relational + queryable ("sort runs by val_acc") — hence a real DB,
#              not the default ./mlruns file store.
#  - mlflow    Tracking server + Model Registry UI on http://localhost:5000.
#              Proxied-artifact mode: the SERVER writes to MinIO; clients only
#              need MLFLOW_TRACKING_URI, zero S3 credentials on the client side.
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: terraops-minio
    ports:
      - "9000:9000"                     # S3 API  -> used by DVC
      - "9001:9001"                     # Web console -> http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin       # dev credentials only (change for prod)
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data                # persists objects across restarts
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # One-shot job: create both buckets (idempotent thanks to --ignore-existing),
  # retrying until MinIO is ready. mlflow's depends_on waits for this to finish.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: terraops-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/terraops-dvc;
      mc mb --ignore-existing local/terraops-mlflow;
      "

  postgres:
    image: postgres:16.13-alpine
    container_name: terraops-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow          # dev credentials only
      POSTGRES_DB: mlflow
    ports:
      # Published because the monitoring CLI runs on the HOST: drift_report.py
      # and drift_monitor.py read monitoring.predictions directly. Without this
      # the documented workflow only works from inside the compose network.
      #
      # 55433, NOT 5432: a native PostgreSQL install owns 5432 on many dev
      # machines (it did on this one). The container would appear to publish the
      # port while every host connection silently reached the OTHER database,
      # failing authentication — and libpq's error message came back in the
      # Windows ANSI codepage, surfacing as a UnicodeDecodeError that says
      # nothing about the real cause. An unusual port removes the whole class.
      - "55433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data # run history survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: terraops-mlflow
    ports:
      - "5000:5000"                      # UI + API -> http://localhost:5000
    environment:
      # Server-side S3 credentials for the artifact proxy (never given to clients)
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
      --artifacts-destination s3://terraops-mlflow
      --serve-artifacts
      --host 0.0.0.0 --port 5000
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # Gate downstream services on a REAL /health 200, not just "container up",
      # so the API never boots against a not-yet-ready registry.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Serving API: loads models:/terraops-eurosat@champion by ALIAS from the registry.
  # Proxied-artifact mode -> only MLFLOW_TRACKING_URI needed, zero S3 credentials.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: terraops-api
    ports:
      - "8000:8000"                      # http://localhost:8000 (/docs for Swagger)
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Sprint 4: prediction log. Same Postgres instance, DEDICATED SCHEMA
      # (monitoring.predictions) — a separate database would require re-running
      # initdb, i.e. `down -v`, i.e. destroying the MLflow history. The schema
      # gives the namespace separation without touching existing state.
      TERRAOPS_DB_URI: postgresql://mlflow:mlflow@postgres:5432/mlflow
    depends_on:
      mlflow:
        condition: service_healthy       # wait for the registry to actually answer
      postgres:
        condition: service_healthy
    healthcheck:
      # /health is a LIVENESS probe (200 even with no model loaded): it says the
      # process answers, not that the champion is served (/model-info says that).
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # Prometheus: scrapes the API's /metrics. Service-level observability only —
  # latency, throughput, class mix, log health. Data-drift detection is NOT here
  # (it needs a reference distribution and row-level history: Evidently over the
  # Postgres prediction log).
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: terraops-prometheus
    ports:
      - "9090:9090"                     # http://localhost:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus     # TSDB survives restarts
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    depends_on:
      - api
    restart: unless-stopped

  # Streamlit UI: a THIN CLIENT of the API (no model, no torch in this image).
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: terraops-ui
    ports:
      - "8501:8501"                      # http://localhost:8501
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  minio-data:
  pg-data:
  prometheus-data:
